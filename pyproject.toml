[project]
name = "hockey-lines"
version = "0.1.0"
description = "CP-SAT based solver that assigns hockey players to forward lines and defensive pairs, exposed as a CLI and a FastAPI service."
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.fastapi]
entrypoint = "api:app"

{% extends "base.html" %}
{% block title %}Rosters — Studio{% endblock %}
{% block content %}
<h1>Rosters</h1>

<form class="new-roster-form" method="post" action="{{ url_for('rosters_new') }}">
  <input type="text" name="title" placeholder="New roster title" required>
  <button type="submit">New blank roster</button>
</form>

{% if rosters %}
<table class="rosters-table">
  <thead>
    <tr><th>Title</th><th>Created</th><th></th></tr>
  </thead>
  <tbody>
    {% for r in rosters %}
    <tr>
      <td><a href="{{ url_for('studio_view', roster_id=r['id']) }}">{{ r['title'] }}</a></td>
      <td>{{ r['created_at'] }}</td>
      <td>
        <form method="post" action="{{ url_for('rosters_delete', roster_id=r['id']) }}"
              onsubmit="return confirm('Delete roster &quot;{{ r['title'] }}&quot;? This cannot be undone.');">
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">No rosters yet — create one above.</p>
{% endif %}
{% endblock %}
